name: Job Agent

on:
  schedule:
    # GitHub cron uses UTC. Target: 09:23, 13:23, 17:23 Israel time.
    - cron: "23 7,11,15 * * *"   # winter (Israel = UTC+2)
    - cron: "23 6,10,14 * * *"   # summer (Israel = UTC+3)
  workflow_dispatch:   # "Run workflow" button for manual runs

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Season check (works even if GitHub starts late)
        id: time
        run: |
          OFFSET=$(TZ=Asia/Jerusalem date +%z)
          echo "Israel time now: $(TZ=Asia/Jerusalem date '+%H:%M') (UTC$OFFSET)"
          echo "Triggered by: ${{ github.event.schedule }}"
          GO=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then GO=true; fi
          if [ "${{ github.event.schedule }}" = "23 7,11,15 * * *" ] && [ "$OFFSET" = "+0200" ]; then GO=true; fi
          if [ "${{ github.event.schedule }}" = "23 6,10,14 * * *" ] && [ "$OFFSET" = "+0300" ]; then GO=true; fi
          echo "go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.time.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.time.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install packages
        if: steps.time.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Create secret files
        if: steps.time.outputs.go == 'true'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PROFILE: ${{ secrets.PROFILE }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
          printf '%s' "$PROFILE" > profile.txt

      - name: Run the agent
        if: steps.time.outputs.go == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python fetch_jobs.py
